name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Unit tests (unprivileged)
        run: python -m pytest -q
      - name: Full suite incl. isolation tests (root)
        run: sudo -E env "PATH=$PATH" python -m pytest -q
